<header class="topbar">
  <div class="topbar__left">
    <button type="button" class="topbar__menu-button" aria-label="Abrir menú" (click)="abrirMenu()">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </svg>
    </button>

    <div>
      <p class="topbar__eyebrow">
        Don Taco's Food
      </p>

      <p class="topbar__date">
        {{ fechaActual() }}
      </p>
    </div>
  </div>

  <div class="topbar__right">
    <button type="button" class="topbar__notification" aria-label="Notificaciones" title="Notificaciones"
      [class.topbar__notification--active]="
    notificaciones() > 0
  " (click)="limpiarNotificaciones()">
      <svg viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>

      @if (notificaciones() > 0) {
      <span class="topbar__notification-count">
        {{ notificaciones() }}
      </span>
      }
    </button>

    <div class="topbar__profile">
      <span class="topbar__avatar">
        {{ usuario()?.nombre?.charAt(0) ?? 'A' }}
      </span>

      <div class="topbar__profile-data">
        <strong>
          {{ usuario()?.nombre ?? 'Administrador' }}
        </strong>

        <span>Sesión activa</span>
      </div>
    </div>
  </div>
</header>
