<div class="confirm-overlay" (click)="cancelarAccion()"></div>

<section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-dialog__icon">
        !
    </div>

    <h2 id="confirm-title">
        {{ titulo() }}
    </h2>

    <p>
        {{ mensaje() }}
    </p>

    <div class="confirm-dialog__actions">
        <app-button variant="secondary" (buttonClick)="cancelarAccion()">
            {{ textoCancelar() }}
        </app-button>

        <app-button [variant]="variantConfirmar()" (buttonClick)="confirmarAccion()">
            {{ textoConfirmar() }}
        </app-button>
    </div>
</section>
